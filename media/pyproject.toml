[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicemorph-media"
version = "0.1.0"
description = "VoiceMorph media I/O — ffmpeg extract/remux (video untouched, audio swapped, sync-safe)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
voicemorph-media = "voicemorph_media.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["voicemorph_media"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer's function-default Argument/Option calls are the intended idiom.
"**/cli.py" = ["B008"]
