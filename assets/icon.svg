<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VoiceMorph icon">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C8CFF"/>
      <stop offset="1" stop-color="#4A5BFF"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#badge)"/>
  <!-- microphone capsule -->
  <rect x="212" y="120" width="88" height="150" rx="44" fill="#FFFFFF"/>
  <!-- equalizer bars inside the capsule (the 'morph' / audio motif) -->
  <rect x="232" y="180" width="12" height="44" rx="6" fill="#4A5BFF"/>
  <rect x="250" y="156" width="12" height="92" rx="6" fill="#4A5BFF"/>
  <rect x="268" y="180" width="12" height="44" rx="6" fill="#4A5BFF"/>
  <!-- cradle -->
  <path d="M188 250 a68 68 0 0 0 136 0" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" fill="none"/>
  <!-- stem + base -->
  <path d="M256 318 v46" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  <path d="M212 372 h88" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
</svg>
