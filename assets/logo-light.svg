<svg width="620" height="160" viewBox="0 0 620 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VoiceMorph">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C8CFF"/>
      <stop offset="1" stop-color="#4A5BFF"/>
    </linearGradient>
    <linearGradient id="wm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A5BFF"/>
      <stop offset="1" stop-color="#6C8CFF"/>
    </linearGradient>
  </defs>

  <!-- icon (512-based, scaled to a 120px badge) -->
  <g transform="translate(12,20) scale(0.234375)">
    <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#badge)"/>
    <rect x="212" y="120" width="88" height="150" rx="44" fill="#FFFFFF"/>
    <rect x="232" y="180" width="12" height="44" rx="6" fill="#4A5BFF"/>
    <rect x="250" y="156" width="12" height="92" rx="6" fill="#4A5BFF"/>
    <rect x="268" y="180" width="12" height="44" rx="6" fill="#4A5BFF"/>
    <path d="M188 250 a68 68 0 0 0 136 0" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M256 318 v46" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
    <path d="M212 372 h88" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- wordmark (dark text for light backgrounds) -->
  <text x="150" y="92" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="58" font-weight="800" letter-spacing="-1">
    <tspan fill="#1B2130">Voice</tspan><tspan fill="url(#wm)">Morph</tspan>
  </text>
  <text x="152" y="120" font-family="'Segoe UI', system-ui, sans-serif" font-size="14.5" font-weight="600" letter-spacing="4.5" fill="#6B7280">VOICE CONVERSION</text>
</svg>
