[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voicemorph-backend"
version = "0.1.0"
description = "VoiceMorph backend — FastAPI REST + WebSocket, Celery/Redis jobs, S3/MinIO storage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "celery>=5.3",
    "redis>=5.0",
    "boto3>=1.34",
    "voicemorph-engine",
    "voicemorph-media",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["voicemorph_backend"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends/File/Form calls in parameter defaults are the intended idiom.
"**/main.py" = ["B008"]
"**/auth.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
