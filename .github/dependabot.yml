version: 2
updates:
  # Python packages (engine / media / backend)
  - package-ecosystem: pip
    directory: /engine
    schedule:
      interval: weekly
    labels: ["dependencies", "python"]
  - package-ecosystem: pip
    directory: /media
    schedule:
      interval: weekly
    labels: ["dependencies", "python"]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    labels: ["dependencies", "python"]

  # JS/TS clients
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    labels: ["dependencies", "javascript"]
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
    labels: ["dependencies", "javascript"]

  # Rust (Tauri shell)
  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    labels: ["dependencies", "rust"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]

  # Docker base images
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]
